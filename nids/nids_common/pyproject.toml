[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flad-flower-nids-common"
version = "1.0.0"
description = "Shared modules for FLAD Flower NIDS applications"
license = "Apache-2.0"
dependencies = [
    "flwr>=1.29.0",
    "flwr-datasets>=0.5.0",
    "h5py>=3.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.0.0",
    "tensorflow>=2.20.0; (platform_machine == \"x86_64\" or platform_machine == \"aarch64\")"
]

[tool.hatch.build.targets.wheel]
packages = ["tf_common"]
