[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flad-flower-nids-fedprox"
version = "1.0.0"
description = "Implementation of a federated learning anomaly detection system using Flower."
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.29.0",
    "scikit-learn>=1.8.0",
    "tensorflow>=2.20.0; (platform_machine == \"x86_64\" or platform_machine == \"aarch64\")"
]
[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "tf_fedprox.server_app:app"
clientapp = "tf_fedprox.client_app:app"

[tool.flwr.app.config]
client_names = "00-WebDDoS,01-LDAP,02-Portmap"
fraction-train = 0.5
proximal_mu = 1.0
rounds = 5
epochs = 1
batch_size = 50
rn_seed = 42
optimizer = "SGD"
output_folder = "./logs/server"